simulation:
  Z: 25
  A: 50
  delta_Z: 1
  n_events: 100000
  reaction_prob: 0.1
  layers: 5
  #velocity_distribution: uniform
  #b_min: 0.6
  #b_max: 0.7
  velocity_distribution: gaussian
  b_mean: 0.746
  b_sigma: 0.001
  eloss_scaling: 0.61  # or whatever factor you need to match ~300 MeV/layer
  layer_thickness: [0.4997, 0.5123, 0.5211, 0.5263, 0.5337]

detector:
  energy_resolution: [0.007, 0.007, 0.007, 0.007, 0.007]  # ~1.7% (FWHM) per layer

analysis:
  features: ['b_in', 'b_out', 'dE_1', 'dE_2', 'dE_3', 'dE_4', 'dE_5']
  target: reaction_layer
  models: ['logreg', 'rf', "svc", "lgbm"]
  #models: ['logreg', 'rf', 'knn', 'gb']
  #models: ['logreg', 'rf', 'knn']
  test_size: 0.25
